<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960">
  <rect width="1280" height="960" fill="#ffffff"/>
  <text x="1208.00" y="920.17" font-size="24.00" font-family="Arial, sans-serif" font-weight="400" font-style="normal" fill="#111827" text-anchor="end">‹#›</text>
<text x="1208.00" y="920.17" font-size="24.00" font-family="Arial, sans-serif" font-weight="400" font-style="normal" fill="#111827" text-anchor="end">‹#›</text>
<text x="640.00" y="68.84" font-size="24.00" font-family="Arial, sans-serif" font-weight="400" font-style="normal" fill="#111827" text-anchor="middle">Discussion</text>
<text x="80.80" y="254.40" font-size="24.00" font-family="Arial, sans-serif" font-weight="400" font-style="normal" fill="#111827" text-anchor="start">Mixtures are combinations of two or more substances that can be homogeneous or</text>
<text x="80.80" y="284.40" font-size="24.00" font-family="Arial, sans-serif" font-weight="400" font-style="normal" fill="#111827" text-anchor="start">heterogeneous. Homogeneous mixtures appear uniform all throughout because they have the</text>
<text x="80.80" y="314.40" font-size="24.00" font-family="Arial, sans-serif" font-weight="400" font-style="normal" fill="#111827" text-anchor="start">same proportion. Heterogeneous mixtures are not uniform in proportion where combined</text>
<text x="80.80" y="344.40" font-size="24.00" font-family="Arial, sans-serif" font-weight="400" font-style="normal" fill="#111827" text-anchor="start">substances are not evenly spread or mixed.</text>
</svg>
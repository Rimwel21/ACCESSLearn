  <text x="1208.00" y="920.17" font-size="24.00" font-family="Arial, sans-serif" font-weight="400" font-style="normal" fill="#111827" text-anchor="end">‹#›</text>
<text x="1208.00" y="920.17" font-size="24.00" font-family="Arial, sans-serif" font-weight="400" font-style="normal" fill="#111827" text-anchor="end">‹#›</text>
<text x="80.80" y="254.40" font-size="24.00" font-family="Arial, sans-serif" font-weight="400" font-style="normal" fill="#111827" text-anchor="start">Homogeneous mixtures have uniform composition where the substances are evenly mixed.</text>
<text x="80.80" y="284.40" font-size="24.00" font-family="Arial, sans-serif" font-weight="400" font-style="normal" fill="#111827" text-anchor="start">They are also called solution. In its component, the substance that dissolves or seems</text>
<text x="80.80" y="314.40" font-size="24.00" font-family="Arial, sans-serif" font-weight="400" font-style="normal" fill="#111827" text-anchor="start">to disappear is called a</text>
<text x="80.80" y="344.40" font-size="24.00" font-family="Arial, sans-serif" font-weight="400" font-style="normal" fill="#111827" text-anchor="start">solute while the one that dissolves is the solvent.</text>
</svg>
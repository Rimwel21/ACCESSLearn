<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960">
  <rect width="1280" height="960" fill="#ffffff"/>
  <text x="1208.00" y="920.17" font-size="24.00" font-family="Arial, sans-serif" font-weight="400" font-style="normal" fill="#111827" text-anchor="end">‹#›</text>
<text x="1208.00" y="920.17" font-size="24.00" font-family="Arial, sans-serif" font-weight="400" font-style="normal" fill="#111827" text-anchor="end">‹#›</text>
<text x="640.00" y="68.84" font-size="24.00" font-family="Arial, sans-serif" font-weight="400" font-style="normal" fill="#111827" text-anchor="middle">Types of Mixture</text>
<text x="80.80" y="254.40" font-size="24.00" font-family="Arial, sans-serif" font-weight="400" font-style="normal" fill="#111827" text-anchor="start">There are two types of mixtures. One is homogenous mixture which contains substances</text>
<text x="80.80" y="284.40" font-size="24.00" font-family="Arial, sans-serif" font-weight="400" font-style="normal" fill="#111827" text-anchor="start">that are evenly mixed and is uniform throughout in terms of physical appearance. The</text>
<text x="80.80" y="314.40" font-size="24.00" font-family="Arial, sans-serif" font-weight="400" font-style="normal" fill="#111827" text-anchor="start">other one is heterogeneous mixture which contains component substances that are usually</text>
<text x="80.80" y="344.40" font-size="24.00" font-family="Arial, sans-serif" font-weight="400" font-style="normal" fill="#111827" text-anchor="start">easy to distinguish.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="36" y="36" width="1208" height="648" rx="16" fill="#f4fbfa" stroke="#0f766e" stroke-width="6"/>
  <text x="78" y="104" font-size="24" font-family="Arial, sans-serif" font-weight="700" fill="#0f766e">Slide 6</text>
  <text x="78" y="156" font-size="42" font-family="Arial, sans-serif" font-weight="800" fill="#102a2a">Discussion</text>
  <g font-family="Arial, sans-serif"><text x="78" y="206" font-size="28" fill="#263238">Mixtures are combinations of two or more substances that can be</text>
<text x="78" y="244" font-size="28" fill="#263238">homogeneous or heterogeneous. Homogeneous mixtures appear uniform all</text>
<text x="78" y="282" font-size="28" fill="#263238">throughout because they have the same proportion. Heterogeneous mixtures</text>
<text x="78" y="320" font-size="28" fill="#263238">are not uniform in proportion where combined substances are not evenly</text>
<text x="78" y="358" font-size="28" fill="#263238">spread or mixed.</text></g>
</svg>
<text x="80.80" y="254.40" font-size="24.00" font-family="Arial, sans-serif" font-weight="400" font-style="normal" fill="#111827" text-anchor="start">2.What is the best definition for heterogeneous?</text>
<text x="80.80" y="284.40" font-size="24.00" font-family="Arial, sans-serif" font-weight="400" font-style="normal" fill="#111827" text-anchor="start">a. We cannot distinguish their components.</text>
<text x="80.80" y="314.40" font-size="24.00" font-family="Arial, sans-serif" font-weight="400" font-style="normal" fill="#111827" text-anchor="start">b.It is made of solid and liquid substances.</text>
<text x="80.80" y="344.40" font-size="24.00" font-family="Arial, sans-serif" font-weight="400" font-style="normal" fill="#111827" text-anchor="start">c. It is made of liquid and gas substances.</text>
<text x="80.80" y="374.40" font-size="24.00" font-family="Arial, sans-serif" font-weight="400" font-style="normal" fill="#111827" text-anchor="start">d. we can distinguish their components.</text>

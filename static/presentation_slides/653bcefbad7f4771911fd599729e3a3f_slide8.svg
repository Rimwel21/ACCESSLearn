<text x="62.09" y="288.64" font-size="24.00" font-family="Arial, sans-serif" font-weight="400" font-style="normal" fill="#111827" text-anchor="start">1. How will you define mixture?</text>
<text x="62.09" y="336.64" font-size="24.00" font-family="Arial, sans-serif" font-weight="400" font-style="normal" fill="#111827" text-anchor="start">2. What are the 2 types of mixtures? __________ and ___________.</text>

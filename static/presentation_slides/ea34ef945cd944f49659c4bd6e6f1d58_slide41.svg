<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960">
  <rect width="1280" height="960" fill="#ffffff"/>
  <text x="1208.00" y="920.17" font-size="24.00" font-family="Arial, sans-serif" font-weight="400" font-style="normal" fill="#111827" text-anchor="end">‹#›</text>
<text x="1208.00" y="920.17" font-size="24.00" font-family="Arial, sans-serif" font-weight="400" font-style="normal" fill="#111827" text-anchor="end">‹#›</text>
<text x="80.80" y="254.40" font-size="24.00" font-family="Arial, sans-serif" font-weight="400" font-style="normal" fill="#111827" text-anchor="start">Most of the time, the formation of this kind of mixture is associated with the process</text>
<text x="80.80" y="284.40" font-size="24.00" font-family="Arial, sans-serif" font-weight="400" font-style="normal" fill="#111827" text-anchor="start">of dissolving. We say soluble if the solid solute completely dissolved in the liquid</text>
<text x="80.80" y="314.40" font-size="24.00" font-family="Arial, sans-serif" font-weight="400" font-style="normal" fill="#111827" text-anchor="start">solvent and insoluble if it is not. While if the components are both liquid, the term</text>
<text x="80.80" y="344.40" font-size="24.00" font-family="Arial, sans-serif" font-weight="400" font-style="normal" fill="#111827" text-anchor="start">miscible or immiscible is used. Salt dissolves in water. Salt is the solute, and water</text>
<text x="80.80" y="374.40" font-size="24.00" font-family="Arial, sans-serif" font-weight="400" font-style="normal" fill="#111827" text-anchor="start">is the solvent. This property of solutes is called solubility. It is measured in the</text>
<text x="80.80" y="404.40" font-size="24.00" font-family="Arial, sans-serif" font-weight="400" font-style="normal" fill="#111827" text-anchor="start">amount of solute that can dissolve in a fixed amount of solvent. Air is an example of</text>
<text x="80.80" y="434.40" font-size="24.00" font-family="Arial, sans-serif" font-weight="400" font-style="normal" fill="#111827" text-anchor="start">gaseous solution. Metal alloys are examples of solutions in the solid phase. Ammonia</text>
<text x="80.80" y="464.40" font-size="24.00" font-family="Arial, sans-serif" font-weight="400" font-style="normal" fill="#111827" text-anchor="start">water is a liquid solution made up of ammonia gas dissolved in water. Ammonia gas is</text>
<text x="80.80" y="494.40" font-size="24.00" font-family="Arial, sans-serif" font-weight="400" font-style="normal" fill="#111827" text-anchor="start">the solute and water is the solvent.</text>
</svg>